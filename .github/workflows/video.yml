name: Mix video to YouTube

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Mix date (YYYY-MM-DD)"
        required: true
      loop_url:
        description: "Link to the approved 15s loop clip (first frame = last frame); not needed for thumbnail-only"
        required: false
      title:
        description: "YouTube title; not needed for thumbnail-only"
        required: false
      thumb_url:
        description: "Optional link to the thumbnail image (resized to 1280x720)"
        required: false
      video_id:
        description: "Thumbnail only: set thumb_url on this existing video, no render or upload"
        required: false
      privacy:
        description: "private, unlisted or public (first runs: private)"
        default: "private"
      publish_at:
        description: "Optional RFC3339 time to go public, e.g. 2026-10-22T08:00:00Z (stays private until then)"
        required: false
      speed:
        description: "Speed-up for the loop clip (models render the car too slow)"
        default: "2.5"
      trim_start:
        description: "Seconds to cut off the start of the mix (cold open for mixes made before 2026-10-25)"
        default: "0"
      render_only:
        description: "Render only, keep the mp4 as a run artifact, no upload"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mix-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          bash tools/install_ffmpeg.sh
          pip install -q requests

      - name: Render and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IN_DATE: ${{ inputs.date }}
          IN_LOOP: ${{ inputs.loop_url }}
          IN_TITLE: ${{ inputs.title }}
          IN_PRIVACY: ${{ inputs.privacy }}
          IN_PUBLISH_AT: ${{ inputs.publish_at }}
          IN_THUMB: ${{ inputs.thumb_url }}
          IN_VIDEO: ${{ inputs.video_id }}
          IN_SPEED: ${{ inputs.speed }}
          IN_TRIM: ${{ inputs.trim_start }}
        run: |
          if [ -n "$IN_VIDEO" ]; then
            python3 tools/render_upload.py --date "$IN_DATE" --loop-url none --title none --video-id "$IN_VIDEO" --thumb-url "$IN_THUMB"
            exit $?
          fi
          ARGS=(--date "$IN_DATE" --loop-url "$IN_LOOP" --title "$IN_TITLE" --privacy "$IN_PRIVACY" --speed "${IN_SPEED:-2.5}")
          [ -n "$IN_PUBLISH_AT" ] && ARGS+=(--publish-at "$IN_PUBLISH_AT")
          [ -n "$IN_THUMB" ] && ARGS+=(--thumb-url "$IN_THUMB")
          [ -n "$IN_TRIM" ] && [ "$IN_TRIM" != "0" ] && ARGS+=(--trim-start "$IN_TRIM")
          [ "${{ inputs.render_only }}" = "true" ] && ARGS+=(--render-only)
          python3 tools/render_upload.py "${ARGS[@]}"

      - name: Keep the render (render-only runs)
        if: ${{ inputs.render_only }}
        uses: actions/upload-artifact@v4
        with:
          name: mix-video-${{ inputs.date }}
          path: out/video-${{ inputs.date }}/mix-${{ inputs.date }}.mp4
          retention-days: 3

      - name: Save the video link
        if: ${{ !inputs.render_only && inputs.video_id == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "days/${{ inputs.date }}/youtube.json"
          git commit -m "YouTube upload ${{ inputs.date }}" || exit 0
          git pull --rebase -q && git push
