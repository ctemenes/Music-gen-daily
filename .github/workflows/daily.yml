name: Daily mix

on:
  schedule:
    - cron: "55 16 * * *"   # 2:55am Brisbane time (UTC+10, no daylight saving)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD, blank = today in Brisbane)"
        required: false
      tracks:
        description: "Number of tracks (blank = weekday plan)"
        required: false
      theme:
        description: "Theme id (blank = automatic)"
        required: false
      test:
        description: "Test run: don't publish or touch history, just upload the files to this run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-mix
  cancel-in-progress: false

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        timeout-minutes: 8
        run: |
          bash tools/install_ffmpeg.sh
          pip install -q -r requirements.txt

      - name: Generate the mix
        id: gen
        run: |
          DAY="${{ inputs.date }}"
          [ -n "$DAY" ] || DAY=$(TZ=Australia/Brisbane date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          ARGS=(--date "$DAY" --repo "${{ github.repository }}")
          [ "${{ inputs.test }}" = "true" ] && ARGS+=(--no-history)
          [ -n "${{ inputs.tracks }}" ] && ARGS+=(--tracks "${{ inputs.tracks }}")
          [ -n "${{ inputs.theme }}" ] && ARGS+=(--theme "${{ inputs.theme }}")
          python3 daily.py "${ARGS[@]}" || python3 daily.py "${ARGS[@]}" --variant 1

      - name: Keep test output
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: test-mix-${{ steps.gen.outputs.day }}
          path: out/
          retention-days: 3

      - name: Publish release
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./publish.sh "${{ steps.gen.outputs.day }}" "${{ github.repository }}"
