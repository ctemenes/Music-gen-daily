name: Daily mix

on:
  schedule:
    - cron: "48 16 * * *"   # 2:48am Brisbane time (UTC+10, no daylight saving)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD, blank = today in Brisbane)"
        required: false
      tracks:
        description: "Number of tracks (blank = weekday plan)"
        required: false
      theme:
        description: "Theme id (blank = automatic)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-mix
  cancel-in-progress: false

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Generate the mix
        id: gen
        run: |
          DAY="${{ inputs.date }}"
          [ -n "$DAY" ] || DAY=$(TZ=Australia/Brisbane date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          ARGS=(--date "$DAY")
          [ -n "${{ inputs.tracks }}" ] && ARGS+=(--tracks "${{ inputs.tracks }}")
          [ -n "${{ inputs.theme }}" ] && ARGS+=(--theme "${{ inputs.theme }}")
          python3 daily.py "${ARGS[@]}" || python3 daily.py "${ARGS[@]}" --variant 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./publish.sh "${{ steps.gen.outputs.day }}" "${{ github.repository }}"
